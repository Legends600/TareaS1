server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB-URL}
    username: ${DB-USERNAME}
    password: ${DB-PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

    properties:
      hibernate:
        format_sql: false
springdoc:
  swagger-ui:
    enable: false
  api-docs:
    enabled: false
logging:
  level:
    pe.edu.upeu.Practica: INFO
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # En produccion el secreto NUNCA se escribe en el repositorio:
  # llega por variable de entorno (minimo 32 bytes en Base64).
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}
