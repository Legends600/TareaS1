spring:
  application:
    name: Practica
  profiles:
      active: dev
  # El esquema ya existia (creado por Hibernate): Flyway lo toma como
  # version 1 (baseline) y aplica desde V2__seguridad.sql en adelante.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # si Redis no responde, no bloquear la peticion
  cache:
    type: redis
    cache-names: categorias, productos
    redis:
      time-to-live: 10m       # red de seguridad si se olvida invalidar
      enable-statistics: true # aciertos y fallos en /actuator/metrics
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
